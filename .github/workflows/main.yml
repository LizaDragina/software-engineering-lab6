name: Automated Build Pipeline
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET Compiler
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Build Utilities (CMake, Make)
        run: sudo apt-get update && sudo apt-get install -y cmake make

      - name: Compile Library and Application
        run: |
          rm -rf MyLibrary/build MainApp/build
          cd MyLibrary && cmake -B build -S . && cmake --build build && cd ..
          mkdir -p target/lib && cp MyLibrary/bin/Release/net8.0/MyLibrary.dll target/lib/
          cd MainApp && cmake -B build -S . && cmake --build build && cd ..
