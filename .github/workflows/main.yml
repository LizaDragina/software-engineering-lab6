name: CI Build Check
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check test file
        run: wc -l test_travis.txt
      - name: Build C# projects
        run: |
          dotnet build MyLibrary/MyLibrary.csproj -c Release
          dotnet build MainApp/MainApp.csproj -c Release
