language: csharp
mono: none
dotnet: 8.0

addons:
  apt:
    packages:
      - doxygen

script:
  - wc -l test_travis.txt
  - dotnet build MyLibrary/MyLibrary.csproj -c Release
  - dotnet build MainApp/MainApp.csproj -c Release
  - doxygen Doxyfile

deploy:
  provider: pages
  skip_cleanup: true
  github_token: $DOCS_TOKEN
  repo: LizaDragina/software-engineering-lab6.io
  target_branch: main
  local_dir: docs/html
  on:
    branch: main